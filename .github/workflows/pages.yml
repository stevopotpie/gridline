# Rebuilds Gridline and publishes the season board, calculator and bet log to GitHub Pages.
# Runs on a schedule (after the weekend for grading, and before each game day), whenever a new odds
# snapshot lands in odds/, and on demand from the Actions tab. Nothing is committed back to the repo.
name: Publish pages

on:
  schedule:
    # Times are UTC. During daylight time these are 11:15 AM ET Tue, 8:15 AM ET Thu, Sat and Sun, and 4:15 PM ET Mon.
    - cron: "15 15 * * 2"
    - cron: "15 12 * * 4,6,0"
    - cron: "15 20 * * 1"
  push:
    branches: [main]
    paths:
      - "odds/**"
      - "*.py"
      - "run_all.sh"
      - "templates/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: bash run_all.sh "$GITHUB_WORKSPACE"

      - name: Assemble the site
        run: |
          python3 -I site/assemble.py "$GITHUB_WORKSPACE" _site
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
